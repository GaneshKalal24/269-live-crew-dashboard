<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — 269-ARD Live Crew Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070A0F; --ink:#EEF1F6; --dim:#8B93A7; --line:rgba(255,255,255,.10);
  --glass:rgba(255,255,255,.05); --glass-2:rgba(255,255,255,.03);
  --acc:#7C5CFF; --acc2:#22D3EE; --green:#34D399; --red:#F87171;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh;position:relative;}
.bgfx{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.42;mix-blend-mode:screen;}
.blob.b1{width:560px;height:560px;background:#7C5CFF;top:-160px;left:-120px;animation:drift1 22s ease-in-out infinite;}
.blob.b2{width:500px;height:500px;background:#22D3EE;bottom:-180px;right:-120px;animation:drift2 26s ease-in-out infinite;}
.blob.b3{width:420px;height:420px;background:#EC4899;top:40%;left:55%;opacity:.28;animation:drift3 30s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(120px,90px) scale(1.1);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-100px,-80px) scale(1.15);}}
@keyframes drift3{0%,100%{transform:translate(0,0);}33%{transform:translate(-90px,60px);}66%{transform:translate(70px,-70px);}}
.grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 20%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 50%,#000 20%,transparent 72%);
  animation:gridmove 24s linear infinite;}
@keyframes gridmove{from{background-position:0 0;}to{background-position:52px 52px;}}
.particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.particles i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 6px rgba(124,92,255,.8);animation:rise linear infinite;}
@keyframes rise{0%{transform:translateY(0);opacity:0;}10%{opacity:1;}100%{transform:translateY(-104vh);opacity:0;}}
.sweep{position:fixed;top:0;left:0;right:0;height:2px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.6),transparent);animation:sweep 7s linear infinite;}
@keyframes sweep{0%{transform:translateY(-4px);}100%{transform:translateY(100vh);}}
.card{position:relative;z-index:3;width:380px;max-width:92vw;padding:34px 30px 28px;
  background:var(--glass);border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(26px);box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
  animation:cardin .8s cubic-bezier(.2,.9,.25,1);}
@keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.card::before{content:'';position:absolute;inset:-1px;border-radius:20px;padding:1px;
  background:linear-gradient(135deg,rgba(124,92,255,.6),rgba(34,211,238,.5),transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.8;}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  box-shadow:0 8px 26px rgba(124,92,255,.5);position:relative;flex-shrink:0;}
.logo::after{content:'';position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));animation:lpulse 2.4s infinite;}
@keyframes lpulse{0%{opacity:.55;transform:scale(1);}100%{opacity:0;transform:scale(1.6);}}
h2{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;line-height:1.1;}
.login-subtitle{color:var(--dim);font-size:12.5px;margin:2px 0 22px;}
.form-group{margin-bottom:14px;}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:600;margin-bottom:6px;}
input{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:11px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--glass-2);color:var(--ink);transition:.2s;}
input::placeholder{color:#5A6478;}
input:focus{outline:none;border-color:var(--acc2);box-shadow:0 0 0 3px rgba(34,211,238,.15);background:rgba(255,255,255,.06);}
.btn-primary{width:100%;margin-top:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:12px;border-radius:11px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;position:relative;overflow:hidden;transition:.2s;}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 24px rgba(124,92,255,.4);}
.btn-primary::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite;}
@keyframes shine{0%,60%{left:-60%;}100%{left:120%;}}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--dim);font-size:11.5px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line);}
.btn-secondary{width:100%;padding:11px;border-radius:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--ink);transition:.2s;}
.btn-secondary:hover{background:rgba(255,255,255,.06);border-color:var(--acc2);}
.error-msg{color:var(--red);font-size:12.5px;margin-bottom:12px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.25);padding:9px 11px;border-radius:9px;}
.hint{color:var(--dim);font-size:11px;line-height:1.5;margin-top:16px;text-align:center;}
.foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;z-index:3;color:#4A5568;font-size:10.5px;font-family:'JetBrains Mono',monospace;letter-spacing:1px;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;}}
</style>
</head>
<body>
  <div class="bgfx"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
  <div class="grid"></div>
  <div class="particles" id="particles"></div>
  <div class="sweep"></div>

  <div class="card">
    <div class="brandrow">
      <div class="logo"></div>
      <div><h2>269-ARD Dashboard</h2><div class="login-subtitle">Altona Refinery Demolition — Crew Board</div></div>
    </div>
    <div id="error-msg" class="error-msg" style="display:none;"></div>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@company.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Sign In</button>
    </form>
    <div class="divider"><span>or</span></div>
    <button id="guest-btn" class="btn-secondary">👁  Continue as Guest (view only)</button>
    <div class="hint">Guests can view the live board and look-ahead, but can't change anything or open Reports.</div>
  </div>
  <div class="foot">269-ARD · LIVE CREW POSITION SYSTEM</div>

<script type="module">
  import { auth } from "./js/firebase-config.js";
  import { signInWithEmailAndPassword, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  (function(){
    const box=document.getElementById('particles');
    for(let i=0;i<26;i++){
      const p=document.createElement('i');
      p.style.left=Math.random()*100+'%';
      const dur=6+Math.random()*10;
      p.style.animationDuration=dur+'s';
      p.style.animationDelay=(-Math.random()*dur)+'s';
      const sz=2+Math.random()*2.5; p.style.width=p.style.height=sz+'px';
      p.style.opacity=.3+Math.random()*.5;
      box.appendChild(p);
    }
  })();

  onAuthStateChanged(auth,(user)=>{ if(user) window.location.href='index.html'; });

  const errEl=document.getElementById('error-msg');
  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    errEl.style.display='none';
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    try{
      await signInWithEmailAndPassword(auth,email,password);
      window.location.href='index.html';
    }catch(err){
      errEl.textContent='Sign-in failed — check your email and password.';
      errEl.style.display='block';
    }
  });

  document.getElementById('guest-btn').addEventListener('click', async ()=>{
    errEl.style.display='none';
    try{
      await signInAnonymously(auth);
      localStorage.setItem('ard-guest','true');
      window.location.href='index.html';
    }catch(err){
      errEl.textContent="Guest access isn't enabled yet. Ask the administrator to turn on Anonymous sign-in.";
      errEl.style.display='block';
    }
  });
</script>
</body>
</html>
