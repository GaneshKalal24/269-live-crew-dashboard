<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — 269-ARD Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#080B10; --panel:#111823; --border:#26303F; --text:#EAF0F7; --muted:#8A97A8; --cyan:#22D3EE; --green:#22C55E; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card{ width:360px; max-width:92vw; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px 26px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand .dot{ width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green); }
  h1{ font-family:'Oswald',sans-serif; font-size:18px; margin:0; text-transform:uppercase; letter-spacing:.5px; }
  .sub{ color:var(--muted); font-size:12px; margin-bottom:22px; }
  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:600; margin:14px 0 5px; }
  input{ width:100%; font-family:inherit; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#151E2B; color:var(--text); }
  button{ width:100%; margin-top:20px; font-family:inherit; font-weight:600; font-size:14px; padding:11px; border-radius:8px; border:none; background:var(--cyan); color:#04222A; cursor:pointer; }
  button:hover{ background:#3FE0F5; }
  .err{ color:#F87171; font-size:12.5px; margin-top:14px; min-height:16px; }
  .hint{ color:var(--muted); font-size:11.5px; margin-top:16px; line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="dot"></span><h1>269-ARD Dashboard</h1></div>
    <div class="sub">Altona Refinery Demolition — Crew Position &amp; Reporting</div>
    <label>Email</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="username">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <button id="loginBtn">Sign in</button>
    <div class="err" id="err"></div>
    <div class="hint">Access is by account only. If you need a login, ask the site administrator to create one for you.</div>
  </div>

<script type="module">
  import { doLogin } from "./js/app-common.js";
  import { auth } from "./js/firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // if already signed in, skip to dashboard
  onAuthStateChanged(auth, (user)=>{ if(user) window.location.href = "index.html"; });

  const err = document.getElementById("err");
  async function attempt(){
    err.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    if(!email || !password){ err.textContent = "Enter email and password."; return; }
    try{
      await doLogin(email, password);
      window.location.href = "index.html";
    }catch(e){
      err.textContent = "Sign-in failed — check your email and password.";
      console.error(e);
    }
  }
  document.getElementById("loginBtn").addEventListener("click", attempt);
  document.getElementById("password").addEventListener("keydown",(e)=>{ if(e.key==="Enter") attempt(); });
</script>
</body>
</html>
