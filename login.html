<script type="module">
        import { auth } from "./js/firebase-config.js";
        import { signInWithEmailAndPassword, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';
            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (err) {
                errEl.textContent = err.message;
                errEl.style.display = 'block';
            }
        });

        document.getElementById('guest-btn').addEventListener('click', async () => {
            const errEl = document.getElementById('error-msg');
            errEl.style.display = 'none';
            try {
                // This triggers Firebase anonymous authentication matching your Firestore rules!
                await signInAnonymously(auth);
                localStorage.setItem('ard-guest', 'true');
                window.location.href = 'index.html';
            } catch (err) {
                errEl.textContent = "Guest sign-in failed: " + err.message;
                errEl.style.display = 'block';
            }
        });
    </script>
